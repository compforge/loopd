<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc">
  <title id="title">loopd collaboration architecture</title>
  <desc id="desc">Operators use an embedded loop-runtime SDK to call Server APIs and receive run streams. Server updates Conv CRDs to wake Operators. Inside Server, collaboration services connect to HarnessRunner and adapters drive Harnesses. Server uses DB for persistence and Redis for live events. User interfaces communicate with Server through HTTP and conversation streams.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#536477"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #172b42; }
      .name { font-size: 26px; font-weight: 650; text-anchor: middle; }
      .detail { font-size: 17px; fill: #536477; text-anchor: middle; }
      .label { font-size: 17px; fill: #536477; text-anchor: middle; paint-order: stroke; stroke: #fbfcfe; stroke-width: 7px; stroke-linejoin: round; }
      .edge { fill: none; stroke: #536477; stroke-width: 2; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="930" fill="#fbfcfe"/>
  <text x="40" y="53" font-size="36" font-weight="750">loopd</text>
  <text x="40" y="85" font-size="18">人、Operator、Harness 的协作平台</text>
  <rect x="360" y="130" width="800" height="100" rx="16" fill="#edf7ef" stroke="#7ca889" stroke-width="2"/>
  <text class="name" x="760" y="180">Operators</text>
  <text class="detail" x="760" y="210">Router · LongHorizon · …</text>
  <rect x="360" y="310" width="800" height="100" rx="16" fill="#edf7ef" stroke="#7ca889" stroke-width="2"/>
  <text class="name" x="760" y="360">loop-runtime</text>
  <text class="detail" x="760" y="390">Poll · Speak · Prompt · Ask / Confirm</text>
  <path class="edge both" d="M760 230 V310"/>
  <text class="label" x="837" y="277">嵌入 SDK</text>
  <rect x="40" y="310" width="220" height="100" rx="16" fill="#f2f0fb" stroke="#a79ac8" stroke-width="2"/>
  <text class="name" x="150" y="360">Conv CRD</text>
  <text class="detail" x="150" y="390">信号 · 消费进度</text>
  <path class="edge" d="M150 310 V180 H360"/>
  <text class="label" x="255" y="160">Watch / 唤醒</text>
  <path class="edge" d="M360 510 H150 V410"/>
  <text class="label" x="253" y="489">通知 / 游标</text>
  <path class="edge both" d="M760 410 V490"/>
  <text class="label" x="892" y="457">HTTP API / Run SSE</text>
  <rect x="360" y="490" width="800" height="220" rx="20" fill="#edf3fc" stroke="#7996bd" stroke-width="2"/>
  <text x="390" y="536" font-size="28" font-weight="650">loop-server</text>
  <rect x="400" y="590" width="225" height="80" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="512.5" y="639">协作服务</text>
  <rect x="725" y="590" width="225" height="80" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="837.5" y="639">HarnessRunner</text>
  <rect x="1000" y="590" width="130" height="80" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="1065" y="639">Adapter</text>
  <path class="edge both" d="M625 630 H725"/>
  <text class="label" x="675" y="574">调用 / 输出</text>
  <path class="edge both" d="M950 630 H1000"/>
  <rect x="40" y="590" width="190" height="80" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="135" y="639">User / UI</text>
  <path class="edge both" d="M230 630 H400"/>
  <text class="label" x="303" y="574">HTTP / Conv SSE</text>
  <rect x="1270" y="590" width="190" height="80" rx="16" fill="#fff7df" stroke="#c5ae68" stroke-width="2"/>
  <text class="name" x="1365" y="639">Harness</text>
  <path class="edge both" d="M1130 630 H1270"/>
  <text class="label" x="1208" y="574">原生协议</text>
  <rect x="400" y="800" width="225" height="90" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="512.5" y="845">DB</text>
  <text class="detail" x="512.5" y="875">持久数据</text>
  <rect x="800" y="800" width="265" height="90" rx="16" fill="#fff" stroke="#a4b3c4" stroke-width="2"/>
  <text class="name" x="932.5" y="845">Redis Stream</text>
  <text class="detail" x="932.5" y="875">实时事件</text>
  <path class="edge both" d="M512 670 V800"/>
  <path class="edge both" d="M590 670 V755 H932 V800"/>
</svg>
