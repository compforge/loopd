<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">loopd component stack and runtime boundaries</title>
  <desc id="desc">User and Operator actors collaborate through DB-backed conversations and messages. Conv CRDs persist consumption and wake reconcilers. The embedded loop-runtime calls Server APIs. Server includes a Harness Engine whose Runner drives Harnesses through Adapters. AgentGo provides in-process execution; durable Harness services and AgentLedger can be integrated separately. Redis and AgentUE support page delivery, not business completion.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="ledger-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c6b3f"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        fill: #111827;
      }
      .layer-name {
        font-size: 20px;
        font-weight: 720;
        fill: #374151;
      }
      .layer-detail {
        font-size: 14px;
        fill: #6b7280;
      }
      .card {
        stroke: #111827;
        stroke-width: 2.7;
        filter: url(#shadow);
      }
      .card-title {
        font-size: 28px;
        font-weight: 740;
        text-anchor: middle;
      }
      .card-detail {
        font-size: 16px;
        fill: #4b5563;
        text-anchor: middle;
      }
      .pill {
        fill: #ffffff;
        stroke: #8da7d3;
        stroke-width: 1.5;
      }
      .pill-text {
        font-size: 15px;
        font-weight: 650;
        text-anchor: middle;
      }
      .flow {
        fill: none;
        stroke: #374151;
        stroke-width: 2.4;
        marker-end: url(#arrow);
      }
      .ledger-flow {
        fill: none;
        stroke: #8c6b3f;
        stroke-width: 2.2;
        stroke-dasharray: 8 7;
        marker-end: url(#ledger-arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#fbfcfe"/>

  <text x="55" y="56" font-size="35" font-weight="760">loopd component stack</text>
  <text x="55" y="91" font-size="19" fill="#6b7280">持久消息协作 · 可扩展 Operator · 分层恢复</text>

  <!-- The labels retain the generic four-layer Agent technology stack. -->
  <text class="layer-name" x="55" y="205">Interface</text>
  <text class="layer-detail" x="55" y="230">协作与可见投影</text>

  <text class="layer-name" x="55" y="455">Orchestrator</text>
  <text class="layer-detail" x="55" y="480">业务 Loop</text>

  <text class="layer-name" x="55" y="700">Agent Loop</text>
  <text class="layer-detail" x="55" y="725">智能执行与工具</text>

  <text class="layer-name" x="55" y="925">Infrastructure</text>
  <text class="layer-detail" x="55" y="950">模型与运行环境</text>

  <!-- Interface: AgentUE is loop-server's visible collaboration projection. -->
  <rect class="card" x="250" y="120" width="1080" height="200" rx="25" fill="#edf3fc"/>
  <path d="M 275 120 H 1305 Q 1330 120 1330 145 V 184 H 250 V 145 Q 250 120 275 120 Z" fill="#dff3f8"/>
  <line x1="250" y1="184" x2="1330" y2="184" stroke="#4c8a9c" stroke-width="2"/>
  <text x="790" y="160" font-size="26" font-weight="730" text-anchor="middle">Web + AgentUE · 会话 / 消息 / 交互卡片</text>
  <text class="card-title" x="435" y="239">loop-server</text>
  <text class="card-detail" x="435" y="273">消息 · DB · Redis</text>
  <rect x="625" y="200" width="680" height="100" rx="16" fill="#fff" stroke="#8da7d3" stroke-width="1.8"/>
  <text class="card-title" x="965" y="240">Harness Engine</text>
  <text class="card-detail" x="965" y="276">Run · Runner · Adapter</text>

  <line class="flow" x1="805" y1="321" x2="805" y2="359"/>
  <rect x="685" y="326" width="240" height="32" rx="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="805" y="347" font-size="14" font-weight="650" text-anchor="middle">Conv CRD · 唤醒 / 消费进度</text>

  <!-- The embedded toolkit sits between Server and Operators. -->
  <rect class="card" x="250" y="324" width="410" height="36" rx="12" fill="#eef0fb"/>
  <text x="455" y="340" font-size="16" font-weight="740" text-anchor="middle">loop-runtime · embedded SDK</text>
  <text x="455" y="354" font-size="12" font-weight="650" text-anchor="middle">Poll · Speak · Prompt · Ask / Confirm</text>
  <path class="flow" d="M250 342 H225 V285 H250"/>
  <text x="137" y="347" font-size="14" text-anchor="middle">HTTP / Run SSE</text>

  <!-- Domain Operators own business state, decisions, and completion semantics. -->
  <rect class="card" x="480" y="365" width="650" height="220" rx="24" fill="#e7f5eb"/>
  <text class="card-title" x="805" y="419">Operators · Domain Loops</text>
  <text class="card-detail" x="805" y="451">Router · Interaction · LongHorizon · 自定义 Operator</text>
  <rect class="pill" x="525" y="491" width="165" height="47" rx="15"/>
  <text class="pill-text" x="607" y="520">Conv CRD</text>
  <rect class="pill" x="705" y="491" width="200" height="47" rx="15"/>
  <text class="pill-text" x="805" y="520">领域 CRD（按需）</text>
  <rect class="pill" x="920" y="491" width="165" height="47" rx="15"/>
  <text class="pill-text" x="1002" y="520">Reconcile</text>
  <text class="card-detail" x="805" y="566">领域状态可恢复 ≠ 恢复 Go 调用栈或未完成的 Agent 执行</text>

  <!-- Server Harness Engine drives execution through Adapters. -->
  <rect class="card" x="250" y="630" width="880" height="205" rx="24" fill="#fff3cf"/>
  <text class="card-title" x="690" y="685">Harness</text>
  <text class="card-detail" x="690" y="719">AgentGo · 持久执行服务</text>
  <rect x="470" y="758" width="440" height="39" rx="19" fill="#fff9e8" stroke="#c59a2c" stroke-width="1.4"/>
  <text x="690" y="784" font-size="14" font-weight="650" text-anchor="middle">Harness 持有执行状态，Adapter 适配恢复</text>

  <!-- The embedded toolkit exposes collaboration and Harness Verbs with read or write effects. -->
  <path class="flow" d="M474 475 H455 V362"/>
  <path class="flow" d="M1145 300 V610 H1100 V630"/>

  <!-- Dashed edges show optional integrations, not built-in loop-server storage. -->
  <line class="ledger-flow" x1="1134" y1="475" x2="1164" y2="475"/>
  <line class="ledger-flow" x1="1134" y1="732" x2="1164" y2="732"/>
  <rect class="card" x="1170" y="365" width="160" height="470" rx="24" fill="#f7f1e8"/>
  <text x="1250" y="428" font-size="23" font-weight="740" text-anchor="middle">AgentLedger</text>
  <line x1="1196" y1="453" x2="1304" y2="453" stroke="#cbb895" stroke-width="1.4"/>
  <text x="1250" y="515" font-size="15" font-weight="650" text-anchor="middle">Checkpoint</text>
  <text x="1250" y="563" font-size="15" font-weight="650" text-anchor="middle">Event · Action</text>
  <text x="1250" y="611" font-size="15" font-weight="650" text-anchor="middle">Retry · Cost</text>
  <text x="1250" y="659" font-size="15" font-weight="650" text-anchor="middle">Audit</text>
  <text x="1250" y="759" font-size="13" fill="#80684a" text-anchor="middle">可接入的执行账本</text>
  <text x="1250" y="781" font-size="13" fill="#80684a" text-anchor="middle">不是聊天数据库</text>

  <!-- Replaceable infrastructure sits below the execution layers. -->
  <rect class="card" x="250" y="880" width="210" height="105" rx="19" fill="#f4f5f7"/>
  <text x="355" y="926" font-size="23" font-weight="700" text-anchor="middle">Model</text>
  <text x="355" y="955" font-size="14" fill="#4b5563" text-anchor="middle">provider / serving</text>

  <rect class="card" x="480" y="880" width="330" height="105" rx="19" fill="#f4f5f7"/>
  <text x="645" y="926" font-size="23" font-weight="700" text-anchor="middle">执行环境 / Sandbox</text>
  <text x="645" y="955" font-size="14" fill="#4b5563" text-anchor="middle">CLI · files · 可扩展隔离</text>

  <rect class="card" x="830" y="880" width="300" height="105" rx="19" fill="#f4f5f7"/>
  <text x="980" y="926" font-size="23" font-weight="700" text-anchor="middle">Kubernetes · CRDs</text>
  <text x="980" y="955" font-size="14" fill="#4b5563" text-anchor="middle">Conv · Run / Execution / Audit</text>

  <line class="ledger-flow" x1="1250" y1="839" x2="1250" y2="869"/>
  <g filter="url(#shadow)">
    <rect x="1160" y="905" width="180" height="66" fill="#e8f5e9" stroke="#3f7650" stroke-width="2.3"/>
    <ellipse cx="1250" cy="905" rx="90" ry="27" fill="#eef9f0" stroke="#3f7650" stroke-width="2.3"/>
    <path d="M 1160 971 A 90 27 0 0 0 1340 971" fill="#e8f5e9" stroke="#3f7650" stroke-width="2.3"/>
  </g>
  <text x="1250" y="946" font-size="18" font-weight="700" text-anchor="middle">AgentLedger Store</text>

  <text x="800" y="1043" font-size="16" fill="#6b7280" text-anchor="middle">DB 保存持久消息 · CRD 保存消费 / 领域进度 · Harness 拥有执行恢复</text>
</svg>
