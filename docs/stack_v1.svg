<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">loopd component stack and runtime boundaries</title>
  <desc id="desc">AgentUE and loop-server form the interface. Domain Operators sit above agentd. The embedded loop-runtime connects Operators to collaboration and Agent execution. AgentLedger records execution facts across orchestration and Agent execution. Models, sandboxes, Hostel, Kubernetes, and CRDs form the infrastructure.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="ledger-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c6b3f"/>
    </marker>
    <style>
      text {
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        fill: #111827;
      }
      .layer-name {
        font-size: 20px;
        font-weight: 720;
        fill: #374151;
      }
      .layer-detail {
        font-size: 14px;
        fill: #6b7280;
      }
      .card {
        stroke: #111827;
        stroke-width: 2.7;
        filter: url(#shadow);
      }
      .card-title {
        font-size: 28px;
        font-weight: 740;
        text-anchor: middle;
      }
      .card-detail {
        font-size: 16px;
        fill: #4b5563;
        text-anchor: middle;
      }
      .pill {
        fill: #ffffff;
        stroke: #8da7d3;
        stroke-width: 1.5;
      }
      .pill-text {
        font-size: 15px;
        font-weight: 650;
        text-anchor: middle;
      }
      .flow {
        fill: none;
        stroke: #374151;
        stroke-width: 2.4;
        marker-end: url(#arrow);
      }
      .ledger-flow {
        fill: none;
        stroke: #8c6b3f;
        stroke-width: 2.2;
        stroke-dasharray: 8 7;
        marker-end: url(#ledger-arrow);
      }
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#fbfcfe"/>

  <text x="55" y="56" font-size="35" font-weight="760">loopd component stack</text>
  <text x="55" y="91" font-size="19" fill="#6b7280">组件分层与运行边界</text>

  <!-- The labels retain the generic four-layer Agent technology stack. -->
  <text class="layer-name" x="55" y="205">Interface</text>
  <text class="layer-detail" x="55" y="230">协作与可见投影</text>

  <text class="layer-name" x="55" y="455">Orchestrator</text>
  <text class="layer-detail" x="55" y="480">业务 Loop</text>

  <text class="layer-name" x="55" y="700">Agent Loop</text>
  <text class="layer-detail" x="55" y="725">可靠智能执行</text>

  <text class="layer-name" x="55" y="925">Infrastructure</text>
  <text class="layer-detail" x="55" y="950">模型与运行环境</text>

  <!-- Interface: AgentUE is loop-server's visible collaboration projection. -->
  <rect class="card" x="250" y="120" width="1080" height="200" rx="25" fill="#edf3fc"/>
  <path d="M 275 120 H 1305 Q 1330 120 1330 145 V 184 H 250 V 145 Q 250 120 275 120 Z" fill="#dff3f8"/>
  <line x1="250" y1="184" x2="1330" y2="184" stroke="#4c8a9c" stroke-width="2"/>
  <text x="790" y="160" font-size="26" font-weight="730" text-anchor="middle">AgentUE · UI semantic projection</text>
  <text class="card-title" x="790" y="239">loop-server</text>
  <text class="card-detail" x="790" y="273">Conversation · Message · Task lifecycle · reconnectable progress</text>

  <line class="flow" x1="805" y1="321" x2="805" y2="359"/>
  <rect x="685" y="326" width="240" height="32" rx="16" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="805" y="347" font-size="14" font-weight="650" text-anchor="middle">Conversation · Task</text>

  <!-- loop-runtime is an embedded SDK, not another standalone service. -->
  <rect class="card" x="250" y="365" width="190" height="470" rx="24" fill="#eef0fb"/>
  <rect x="276" y="393" width="138" height="31" rx="15" fill="#ffffff" stroke="#7f86b6" stroke-width="1.4"/>
  <text x="345" y="414" font-size="14" font-weight="680" text-anchor="middle">embedded SDK</text>
  <text x="345" y="475" font-size="24" font-weight="740" text-anchor="middle">loop-runtime</text>
  <line x1="285" y1="503" x2="405" y2="503" stroke="#a8add0" stroke-width="1.4"/>
  <text x="345" y="551" font-size="16" font-weight="650" text-anchor="middle">Task</text>
  <text x="345" y="594" font-size="16" font-weight="650" text-anchor="middle">Chat</text>
  <text x="345" y="637" font-size="16" font-weight="650" text-anchor="middle">Harness</text>
  <text x="345" y="680" font-size="16" font-weight="650" text-anchor="middle">Verbs</text>
  <text x="345" y="759" font-size="14" fill="#5b628d" text-anchor="middle">稳定 API 与执行身份</text>

  <!-- Domain Operators own business state, decisions, and completion semantics. -->
  <rect class="card" x="480" y="365" width="650" height="220" rx="24" fill="#e7f5eb"/>
  <text class="card-title" x="805" y="419">Operators · Domain Loops</text>
  <text class="card-detail" x="805" y="451">业务用代码表达领域状态、判断与完成条件</text>
  <rect class="pill" x="525" y="491" width="165" height="47" rx="15"/>
  <text class="pill-text" x="607" y="520">Task CRD</text>
  <rect class="pill" x="705" y="491" width="200" height="47" rx="15"/>
  <text class="pill-text" x="805" y="520">Domain Resource</text>
  <rect class="pill" x="920" y="491" width="165" height="47" rx="15"/>
  <text class="pill-text" x="1002" y="520">Reconcile</text>

  <!-- agentd owns managed, recoverable execution of one Agent. -->
  <rect class="card" x="480" y="630" width="650" height="205" rx="24" fill="#fff3cf"/>
  <text class="card-title" x="805" y="685">agentd · Managed Agent execution</text>
  <text class="card-detail" x="805" y="719">model loop · tools · native state · checkpoint · resume</text>
  <rect x="585" y="758" width="440" height="39" rx="19" fill="#fff9e8" stroke="#c59a2c" stroke-width="1.4"/>
  <text x="805" y="784" font-size="14" font-weight="650" text-anchor="middle">一个 Agent 的无损、可恢复执行边界</text>

  <!-- The embedded toolkit exposes collaboration and Harness Verbs with read or write effects. -->
  <line class="flow" x1="442" y1="475" x2="474" y2="475"/>
  <line class="flow" x1="442" y1="732" x2="474" y2="732"/>

  <!-- AgentLedger records execution facts across both execution layers. -->
  <line class="ledger-flow" x1="1134" y1="475" x2="1164" y2="475"/>
  <line class="ledger-flow" x1="1134" y1="732" x2="1164" y2="732"/>
  <rect class="card" x="1170" y="365" width="160" height="470" rx="24" fill="#f7f1e8"/>
  <text x="1250" y="428" font-size="23" font-weight="740" text-anchor="middle">AgentLedger</text>
  <line x1="1196" y1="453" x2="1304" y2="453" stroke="#cbb895" stroke-width="1.4"/>
  <text x="1250" y="515" font-size="15" font-weight="650" text-anchor="middle">Effect</text>
  <text x="1250" y="563" font-size="15" font-weight="650" text-anchor="middle">Harness Call</text>
  <text x="1250" y="611" font-size="15" font-weight="650" text-anchor="middle">Retry · Cost</text>
  <text x="1250" y="659" font-size="15" font-weight="650" text-anchor="middle">Audit</text>
  <text x="1250" y="759" font-size="13" fill="#80684a" text-anchor="middle">完整执行事实</text>
  <text x="1250" y="781" font-size="13" fill="#80684a" text-anchor="middle">不是聊天数据库</text>

  <!-- Replaceable infrastructure sits below the execution layers. -->
  <rect class="card" x="250" y="880" width="210" height="105" rx="19" fill="#f4f5f7"/>
  <text x="355" y="926" font-size="23" font-weight="700" text-anchor="middle">Model</text>
  <text x="355" y="955" font-size="14" fill="#4b5563" text-anchor="middle">provider / serving</text>

  <rect class="card" x="480" y="880" width="330" height="105" rx="19" fill="#f4f5f7"/>
  <text x="645" y="926" font-size="23" font-weight="700" text-anchor="middle">Sandbox / Hostel</text>
  <text x="645" y="955" font-size="14" fill="#4b5563" text-anchor="middle">files · tools · compute</text>

  <rect class="card" x="830" y="880" width="300" height="105" rx="19" fill="#f4f5f7"/>
  <text x="980" y="926" font-size="23" font-weight="700" text-anchor="middle">Kubernetes · CRDs</text>
  <text x="980" y="955" font-size="14" fill="#4b5563" text-anchor="middle">Task · Domain Resource</text>

  <line class="ledger-flow" x1="1250" y1="839" x2="1250" y2="869"/>
  <g filter="url(#shadow)">
    <rect x="1160" y="905" width="180" height="66" fill="#e8f5e9" stroke="#3f7650" stroke-width="2.3"/>
    <ellipse cx="1250" cy="905" rx="90" ry="27" fill="#eef9f0" stroke="#3f7650" stroke-width="2.3"/>
    <path d="M 1160 971 A 90 27 0 0 0 1340 971" fill="#e8f5e9" stroke="#3f7650" stroke-width="2.3"/>
  </g>
  <text x="1250" y="946" font-size="18" font-weight="700" text-anchor="middle">AgentLedger Store</text>

  <text x="800" y="1043" font-size="16" fill="#6b7280" text-anchor="middle">loop-server owns visible collaboration · Operators own domain loops · agentd owns Agent execution</text>
</svg>
