apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.loopd.compforge.io
spec:
  group: loopd.compforge.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - target
                - revision
              properties:
                target:
                  type: object
                  required:
                    - kind
                    - key
                  properties:
                    kind:
                      type: string
                      enum:
                        - operator
                        - harness
                    key:
                      type: string
                      minLength: 1
                revision:
                  type: integer
                  format: int64
                  minimum: 1
