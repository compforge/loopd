{{- if and .Values.router.enabled .Values.router.model.apiKey (not .Values.router.model.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loopd.routerSecretName" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
type: Opaque
stringData:
  {{ .Values.router.model.existingSecretKey }}: {{ .Values.router.model.apiKey | quote }}
{{- end }}

