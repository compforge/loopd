{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopd.routerName" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "loopd.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: router
  template:
    metadata:
      annotations:
        {{- with .Values.router.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "loopd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: router
        {{- with .Values.router.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "loopd.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: router
          image: "{{ .Values.router.image.repository }}:{{ .Values.router.image.tag }}"
          imagePullPolicy: {{ .Values.router.image.pullPolicy }}
          env:
            - name: LOOP_ROUTER_SERVER_URL
              value: {{ printf "http://%s:%v" (include "loopd.serverName" .) .Values.server.service.port | quote }}
            - name: LOOP_ROUTER_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOOP_ROUTER_HARNESS_TARGET
              value: {{ .Values.router.harnessTarget | quote }}
            - name: LOOP_ROUTER_MAX_SUBTASKS
              value: {{ .Values.router.maxSubtasks | quote }}
            - name: LOOP_ROUTER_CONCURRENCY
              value: {{ .Values.router.concurrency | quote }}
            {{- with .Values.router.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.router.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.router.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
