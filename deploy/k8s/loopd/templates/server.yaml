{{- $mysqlEnabled := or .Values.database.mysql.dsn .Values.database.mysql.existingSecret -}}
{{- if ne (int .Values.server.replicaCount) 1 }}
{{- fail "server.replicaCount must be 1 in loopd v1" }}
{{- end }}
{{- if and .Values.database.mysql.dsn .Values.database.mysql.existingSecret }}
{{- fail "database.mysql.dsn and database.mysql.existingSecret are mutually exclusive" }}
{{- end }}
{{- if and (not .Values.redis.address) (not .Values.redis.enabled) }}
{{- fail "redis.address or redis.enabled is required for the AgentUE event bridge" }}
{{- end }}
{{- if and (not .Values.redis.address) .Values.redis.existingSecret }}
{{- fail "redis.existingSecret is only supported with an external redis.address" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loopd.serverName" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "loopd.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopd.serverName" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "loopd.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/database-secret: {{ include (print $.Template.BasePath "/database-secret.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "loopd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "loopd.serviceAccountName" . }}
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: loop-server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          env:
            - name: SERVER_ADDRESS
              value: :8080
            {{- if $mysqlEnabled }}
            - name: DATABASE_DRIVER
              value: mysql
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "loopd.databaseSecretName" . }}
                  key: {{ .Values.database.mysql.existingSecretKey | quote }}
            {{- else }}
            - name: DATABASE_DRIVER
              value: sqlite
            - name: DATABASE_DSN
              value: /var/lib/loopd/loopd.db
            {{- end }}
            - name: REDIS_ADDRESS
              value: {{ include "loopd.redisAddress" . | quote }}
            - name: TASK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.redis.existingSecret }}
            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.existingSecretUsernameKey }}
                  optional: true
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.existingSecretPasswordKey }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            {{- if not $mysqlEnabled }}
            - name: data
              mountPath: /var/lib/loopd
            {{- end }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        {{- if not $mysqlEnabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
