{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "loopd.fullname" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
rules:
  - apiGroups: ["loopd.compforge.io"]
    resources: ["conversations"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["loopd.compforge.io"]
    resources: ["conversations/status"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "loopd.fullname" . }}
  labels:
    {{- include "loopd.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "loopd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "loopd.fullname" . }}
{{- end }}
