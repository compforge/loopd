imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

server:
  # v1 keeps one server replica even when an external MySQL is configured.
  replicaCount: 1
  image:
    repository: ghcr.io/compforge/loop-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

database:
  # When neither field is set, loop-server uses ephemeral SQLite for the
  # Quick Start. Set dsn or existingSecret to use an external MySQL.
  mysql:
    dsn: ""
    existingSecret: ""
    existingSecretKey: dsn

router:
  enabled: true
  image:
    repository: ghcr.io/compforge/loop-router
    tag: latest
    pullPolicy: IfNotPresent
  model:
    name: gpt-5-mini
    # OpenAI-compatible API endpoint. Leave empty to use AgentGo's default.
    baseURL: ""
    # Quick Start may set apiKey directly. Production should reference an
    # existing Secret so the credential is not stored in Helm values.
    apiKey: ""
    existingSecret: ""
    existingSecretKey: api-key
  maxSubtasks: 4
  concurrency: 4
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/compforge/loop-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  # Set address to use an external Redis. When empty, enabled must be true and
  # the Chart installs the Quick Start Redis workload.
  address: ""
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: loopd.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional three-role CLI reference Operator. AgentGo calls are process-local.
longhorizon:
  runTimeout: 24h
  retentionTTL: 24h
  enabled: false
  image:
    repository: ghcr.io/compforge/loop-longhorizon
    tag: latest
    pullPolicy: IfNotPresent
  model:
    provider: openai
    name: gpt-5-mini
    baseURL: ""
    existingSecret: ""
    existingSecretKey: api-key
  maxRounds: 25
  managerTimeout: 5m
  executorTimeout: 30m
  auditorTimeout: 5m
  humanTimeout: 30m
  workspace:
    # Empty uses ephemeral storage. A claim preserves artifacts across restarts.
    existingClaim: ""
    sizeLimit: 2Gi
  resources: {}
  extraEnv: []
