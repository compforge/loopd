imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

server:
  # Inactivity timeout for ordinary output and Redis retention.
  messageTTL: 24h
  # Multiple Server replicas require shared MySQL and Redis.
  replicaCount: 1
  harnessAPISecret: ""
  harnessAPISecretKey: api-key
  # All Harness adapters run in Server. Use extraEnv for additional named keys.
  harnesses:
    agentgo:
      provider: agentgo
      model_provider: openai
      model: gpt-5-mini
      api_key_env: HARNESS_API_KEY
    manager:
      provider: agentgo
      model_provider: openai
      model: gpt-5-mini
      api_key_env: HARNESS_API_KEY
    executor:
      provider: agentgo
      model_provider: openai
      model: gpt-5-mini
      api_key_env: HARNESS_API_KEY
      tools: write
      workspace_root: /workspace
    auditor:
      provider: agentgo
      model_provider: openai
      model: gpt-5-mini
      api_key_env: HARNESS_API_KEY
      tools: read
      workspace_root: /workspace
  workspace:
    existingClaim: ""
    sizeLimit: 2Gi
  image:
    repository: ghcr.io/compforge/loop-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

database:
  # When neither field is set, loop-server uses ephemeral SQLite for the
  # Quick Start. Set dsn or existingSecret to use an external MySQL.
  mysql:
    dsn: ""
    existingSecret: ""
    existingSecretKey: dsn

router:
  enabled: true
  image:
    repository: ghcr.io/compforge/loop-router
    tag: latest
    pullPolicy: IfNotPresent
  harnessTarget: agentgo
  maxSubtasks: 4
  concurrency: 4
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

web:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/compforge/loop-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  # Set address to use an external Redis. When empty, enabled must be true and
  # the Chart installs the Quick Start Redis workload.
  address: ""
  enabled: true
  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  existingSecret: ""
  existingSecretUsernameKey: username
  existingSecretPasswordKey: password
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: loopd.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional three-role CLI reference Operator. AgentGo runs inside Server and is not recoverable.
longhorizon:
  runTimeout: 24h
  retentionTTL: 24h
  enabled: false
  image:
    repository: ghcr.io/compforge/loop-longhorizon
    tag: latest
    pullPolicy: IfNotPresent
  maxRounds: 25
  managerTimeout: 5m
  executorTimeout: 30m
  auditorTimeout: 5m
  humanTimeout: 30m
  resources: {}
  extraEnv: []
